<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Renoweet OS</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0b1020;--panel:#11182a;--panel2:#172238;--line:#26344f;--text:#edf3f8;
  --muted:#9fb0c3;--green:#6fb24b;--green2:#4f9837;--danger:#ff7777;--warn:#f5c56b;
  --blue:#6ba7ff;--shadow:0 14px 40px rgba(0,0,0,.24);--safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}a{color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:#0a0f1c;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 20px}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:11px;padding:5px}
.brand b{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:2px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:11px;margin:2px 0}
.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}
.sidebar-bottom{position:absolute;left:14px;right:14px;bottom:18px}
.content{padding:24px;min-width:0;max-width:1600px;width:100%;margin:auto}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-size:26px;margin:0}.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px}
.btn.primary{background:var(--green);border-color:var(--green);color:#0a1a0b;font-weight:800}.btn.danger{border-color:#5a2b36;color:#ffb7c0;background:#2a141a}
.btn.ghost{background:transparent}.statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0d1525;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;background:#75849a}.dot.ok{background:var(--green)}.dot.warn{background:var(--warn)}
.statusbar .spacer{margin-left:auto}.small{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}.cards4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.metric small{color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:6px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section-title h2{margin:0;font-size:18px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:760px;background:var(--panel)}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600;background:#0f1727;position:sticky;top:0;z-index:2}tr:hover td{background:#121d31}
.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.pill.green{color:#bff2c1;border-color:#326d36;background:#17351a}.pill.warn{color:#ffe0a2;border-color:#705820;background:#33270d}.pill.blue{color:#c5ddff;border-color:#35577e;background:#14283e}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);background:#0c1424;color:var(--text);border-radius:10px;padding:11px 12px;outline:none}
textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#4f7eb6}
.modal{display:none;position:fixed;inset:0;background:rgba(1,5,12,.78);z-index:50;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
.modal.open{display:flex}.modalbox{width:min(1040px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -2px;padding:2px 2px 7px;scrollbar-width:thin}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#0d1525;color:var(--muted);padding:9px 11px;border-radius:10px}.tabs button.active{background:var(--panel2);color:var(--text)}
.lineitems{width:100%;border-collapse:collapse;min-width:700px}.lineitems input{min-width:90px}
.totalbox{margin-left:auto;width:min(360px,100%);margin-top:12px}.totalrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.ai{border:1px solid #345b38;background:#0f2312;padding:13px;border-radius:12px;margin-top:12px}.ai b{color:#9be49d}.ai p{color:#c8d5c8;font-size:13px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow:auto;-webkit-overflow-scrolling:touch}.kanban-col{background:#0d1423;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:240px}
.kanban-col h3{font-size:13px;color:var(--muted);margin:3px 3px 10px}.jobcard{background:var(--panel);border:1px solid var(--line);padding:11px;border-radius:10px;margin-bottom:8px}.jobcard b{display:block}.jobcard small{color:var(--muted)}
.checklist label{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--text)}.checklist input{width:auto;margin-top:3px;transform:scale(1.2)}
.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));background:#142016;border:1px solid #315d34;color:#c9f4cb;padding:11px 14px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:80}.toast.show{opacity:1;transform:none}
.mobile-nav{display:none}.mobile-cards{display:none}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

@media(max-width:900px){
 .app{display:block}.sidebar{display:none}.content{padding:14px 12px calc(86px + var(--safe-bottom))}
 .topbar{align-items:flex-start;flex-direction:column;margin-bottom:12px}.topbar h1{font-size:23px}.topbar .actions{width:100%}.topbar .actions .btn{flex:1}
 .cards4{grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:13px}.metric strong{font-size:22px}
 .formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .modal{padding:0;align-items:stretch}.modalbox{width:100%;min-height:100dvh;border-radius:0;border:0;padding:14px 12px calc(86px + var(--safe-bottom))}
 .modalhead{position:sticky;top:0;background:var(--panel);z-index:10;padding-top:6px}.modalhead .actions .btn{padding:9px 10px}
 .tabs{position:sticky;top:63px;background:var(--panel);z-index:9;padding-top:8px;margin-top:0}
 .desktop-table{display:none}.mobile-cards{display:grid;gap:9px}
 .project-mobile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}
 .project-mobile .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project-mobile .meta{color:var(--muted);font-size:12px;line-height:1.5;margin-top:7px}
 .mobile-nav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(5,1fr);background:rgba(8,13,24,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 5px calc(7px + var(--safe-bottom))}
 .mobile-nav button{background:transparent;border:0;color:var(--muted);font-size:11px;padding:7px 2px;border-radius:9px}.mobile-nav button.active{color:var(--text);background:var(--panel2)}
 .mobile-nav .ico{display:block;font-size:18px;margin-bottom:2px}.statusbar .spacer{display:none}
}
@media(max-width:520px){.cards4{grid-template-columns:1fr 1fr}.section-title{align-items:flex-end}.btn{min-height:44px}.kanban{grid-template-columns:repeat(5,82vw)}}


.pin-lock{position:fixed;inset:0;z-index:500;background:#07101f;display:flex;align-items:center;justify-content:center;padding:20px}
.pin-lock.hidden{display:none}
.pin-box{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);text-align:center}
.pin-logo{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:14px;padding:7px;margin-bottom:12px}
.pin-box h2{margin:0 0 6px;font-size:24px}
.pin-box p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.45}
.pin-input{font-size:24px!important;letter-spacing:8px!important;text-align:center!important;font-weight:800!important;padding:13px!important}
.pin-error{min-height:20px;color:#ff9ca7;font-size:12px;margin-top:7px}
.pin-actions{display:grid;gap:9px;margin-top:12px}

.send-choice{display:none;position:fixed;inset:0;background:rgba(1,5,12,.78);z-index:120;align-items:center;justify-content:center;padding:18px}
.send-choice.open{display:flex}
.send-choice-box{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.send-choice-box h3{margin:0 0 8px}
.send-choice-actions{display:grid;gap:10px;margin-top:14px}
.send-choice-actions .btn{width:100%}

@media print{
 body{background:#fff;color:#000}.sidebar,.topbar,.tabs,.modalhead,.no-print,.toast,.mobile-nav,.statusbar{display:none!important}
 .modal{position:static;display:block!important;background:#fff;padding:0}.modalbox{border:0;box-shadow:none;padding:0;background:#fff;min-height:0}.card{border:0;box-shadow:none;background:#fff;color:#000}
 input,textarea,select{border:0;background:#fff;color:#000;padding:0}.small,label{color:#555}
}

/* --- Renoweet invoice print style --- */
.ros-invoice-preview{
  background:#fff;color:#111;width:210mm;min-height:0;margin:0 auto;padding:17mm 20mm 14mm 16mm;box-sizing:border-box;
  box-shadow:0 12px 36px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif;position:relative;
}
.ros-inv-top{display:grid;grid-template-columns:42% 23% 35%;column-gap:0;align-items:start;min-height:76mm}
.ros-inv-left{grid-column:1;padding-left:9mm;align-self:end;padding-bottom:4mm}
.ros-inv-middle{grid-column:3;grid-row:1;align-self:end;padding:0 0 4mm 3mm;z-index:2}
.ros-inv-business{grid-column:3;grid-row:1;text-align:left;padding-left:3mm;font-size:9.4pt;line-height:1.32;align-self:start}
.ros-inv-brandline{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.ros-inv-brandline img{width:15mm;height:15mm;object-fit:contain}
.ros-inv-brandline strong{font-size:24pt;line-height:1}
.ros-inv-tag{font-size:8.2pt;margin:1mm 0 2mm;white-space:nowrap}
.ros-inv-link{color:#0563c1;text-decoration:underline}
.ros-inv-reg{margin-top:4mm;padding-left:0;font-size:7.8pt;line-height:1.30;white-space:nowrap}
.ros-inv-customer{font-size:12pt;line-height:1.45;margin-bottom:13mm}
.ros-inv-title-row{margin:0}
.ros-inv-title-row h1{font-size:12.5pt;line-height:1.15;margin:0;font-weight:800;white-space:nowrap}
.ros-inv-dates{font-size:9.2pt;line-height:1.4;text-align:left;white-space:nowrap;margin:0}
.ros-inv-table{width:100%;min-width:0!important;max-width:100%;border-collapse:collapse;font-size:11pt;background:#fff;table-layout:fixed;box-sizing:border-box}
.ros-inv-table th{position:static;background:#fff;color:#111;border-bottom:1.5px solid #111;padding:2mm 2mm 1.5mm;font-weight:700}
.ros-inv-table td{border:0;padding:2.2mm 2mm;vertical-align:top;white-space:normal;background:#fff}
.ros-inv-table .desc{width:54%;line-height:1.5}
.ros-inv-table .amt{width:16%;text-align:right;white-space:nowrap}
.ros-inv-table .qty{width:8%;text-align:center;white-space:nowrap}
.ros-inv-table .tot{width:22%;text-align:right;white-space:nowrap;padding-right:3mm!important;box-sizing:border-box}
.ros-inv-summary{width:100%;font-size:11.5pt;border-top:1.5px solid #111;padding-top:2mm}
.ros-inv-sumrow{display:grid;grid-template-columns:54% 16% 8% 22%;min-height:6.5mm;align-items:center}
.ros-inv-sumrow b:first-child{grid-column:2;text-align:right;padding-right:3mm}
.ros-inv-sumrow .mid{grid-column:3;text-align:center}
.ros-inv-sumrow .val{grid-column:4;text-align:right;padding-right:2mm}
.ros-inv-grand{display:grid;grid-template-columns:54% 16% 8% 22%;align-items:center;border-top:1.5px solid #111;border-bottom:1.5px solid #111;padding:2.5mm 0;margin:3mm 0 0 0;font-size:13pt;font-weight:800}
.ros-inv-grand .label{grid-column:2;text-align:right;padding-right:3mm}
.ros-inv-grand .currency{grid-column:3;text-align:center}
.ros-inv-grand .value{grid-column:4;text-align:right;font-size:16pt;padding-right:2mm}
.ros-inv-terms{margin-top:12mm;font-size:10.8pt;line-height:1.45;padding-bottom:14mm}
.ros-inv-terms p{margin:0 0 1mm}
.ros-inv-accept{margin-top:12mm;font-size:10.5pt;font-style:italic}
@media(max-width:700px){
  .ros-invoice-preview{width:210mm;transform-origin:top left;transform:scale(.48);margin:10px 0 -150mm 8px;box-shadow:none}
}
@media(max-width:430px){
  .ros-invoice-preview{transform:scale(.43);margin-left:4px;margin-bottom:-166mm}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;width:210mm;margin:0!important;padding:0!important}
  body *{visibility:hidden!important}
  #projectModal,#projectModal .modalbox,#projectTabContent,
  #projectTabContent .ros-invoice-preview,#projectTabContent .ros-invoice-preview *{visibility:visible!important}
  #projectModal{display:block!important;position:static!important;background:#fff!important;padding:0!important;margin:0!important}
  #projectModal .modalbox{display:block!important;position:static!important;width:210mm!important;min-height:0!important;max-height:none!important;overflow:visible!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important}
  #projectModal .modalhead,#projectTabs,#projectTabContent>.actions{display:none!important}
  #projectTabContent{visibility:visible!important}
  .ros-invoice-preview{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:210mm!important;min-height:0!important;padding-right:20mm!important;box-sizing:border-box!important;box-shadow:none!important;transform:none!important}
  .ros-inv-table{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
  .ros-inv-table th.tot,.ros-inv-table td.tot{padding-right:3mm!important;white-space:nowrap!important;overflow:visible!important}

  .ros-inv-accept{
    position:fixed!important;left:16mm!important;right:16mm!important;bottom:7mm!important;
    margin:0!important;padding-top:2mm!important;background:#fff!important;font-size:9pt!important;
    line-height:1.25!important;z-index:999!important;
  }
}


/* --- Renoweet Planning + Google Calendar --- */
.plan-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.plan-toolbar .spacer{margin-left:auto}
.plan-status{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0d1525;font-size:12px;color:var(--muted)}
.plan-status.ok{border-color:#326d36;color:#bff2c1;background:#17351a}
.plan-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:9px;overflow:auto;padding-bottom:4px}
.plan-day{min-height:190px;background:#0d1423;border:1px solid var(--line);border-radius:12px;padding:9px}
.plan-day.today{border-color:#4f9837}
.plan-day-head{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.plan-job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;cursor:pointer}
.plan-job:hover{border-color:#4f7eb6}
.plan-job b{display:block;font-size:13px}.plan-job small{display:block;color:var(--muted);line-height:1.4;margin-top:4px}
.plan-sync{font-size:11px;margin-top:6px}.plan-sync.synced{color:#9be49d}.plan-sync.local{color:#f5c56b}
.plan-list{display:grid;gap:9px;margin-top:14px}
.plan-list-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.plan-date{font-weight:800}.plan-date small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.google-setup{background:#0f1c2f;border:1px solid #35577e;border-radius:13px;padding:14px;margin-bottom:14px}
.google-setup h3{margin:0 0 7px}.google-setup p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
@media(max-width:900px){.plan-grid{grid-template-columns:repeat(7,78vw)}.plan-list-row{grid-template-columns:1fr}.plan-list-row .actions{width:100%}.plan-list-row .actions .btn{flex:1}}

</style>
</head>
<body>

const PIN_HASH_KEY="renoweet_os_pin_hash_v1";
const PIN_SALT_KEY="renoweet_os_pin_salt_v1";
const PIN_SESSION_KEY="renoweet_os_unlocked";
let pinMode="unlock";

function bytesToHex(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("")}
function randomHex(len=16){
 const a=new Uint8Array(len);crypto.getRandomValues(a);return bytesToHex(a)
}
async function hashPin(pin,salt){
 const data=new TextEncoder().encode(salt+"|"+pin);
 const digest=await crypto.subtle.digest("SHA-256",data);
 return bytesToHex(new Uint8Array(digest))
}
function validPin(pin){return /^\d{4,6}$/.test(pin)}
function showPinError(msg){const e=document.getElementById("pinError");if(e)e.textContent=msg||""}
function showPinLock(mode="unlock"){
 pinMode=mode;
 const lock=document.getElementById("pinLock"),title=document.getElementById("pinTitle"),
       text=document.getElementById("pinText"),btn=document.getElementById("pinActionBtn"),
       inp=document.getElementById("pinInput");
 if(!lock)return;
 lock.classList.remove("hidden");
 showPinError("");
 if(mode==="setup"){
   title.textContent="Create Renoweet PIN";
   text.textContent="Choose a 4–6 digit PIN for this browser/device.";
   btn.textContent="Save PIN";
 }else{
   title.textContent="Renoweet OS";
   text.textContent="Enter your PIN to open Renoweet OS.";
   btn.textContent="Unlock";
 }
 inp.value="";
 setTimeout(()=>inp.focus(),80);
}
function hidePinLock(){
 const lock=document.getElementById("pinLock");if(lock)lock.classList.add("hidden");
 sessionStorage.setItem(PIN_SESSION_KEY,"1");
}
async function handlePinAction(){
 const inp=document.getElementById("pinInput");
 const pin=(inp?.value||"").trim();
 if(!validPin(pin)){showPinError("Use a 4–6 digit numeric PIN.");return}
 try{
   if(pinMode==="setup"){
     const salt=randomHex(16);
     const hash=await hashPin(pin,salt);
     localStorage.setItem(PIN_SALT_KEY,salt);
     localStorage.setItem(PIN_HASH_KEY,hash);
     hidePinLock();
     toast("PIN saved");
     return;
   }
   const salt=localStorage.getItem(PIN_SALT_KEY)||"";
   const saved=localStorage.getItem(PIN_HASH_KEY)||"";
   const hash=await hashPin(pin,salt);
   if(hash===saved){hidePinLock();return}
   showPinError("Incorrect PIN.");
   inp.select();
 }catch(e){
   console.error(e);
   showPinError("PIN security is not available in this browser.");
 }
}
function initPinLock(){
 const saved=localStorage.getItem(PIN_HASH_KEY);
 const unlocked=sessionStorage.getItem(PIN_SESSION_KEY)==="1";
 if(!saved){showPinLock("setup");return}
 if(unlocked){hidePinLock();return}
 showPinLock("unlock");
}
function lockRenoweet(){
 sessionStorage.removeItem(PIN_SESSION_KEY);
 showPinLock("unlock");
}
async function changePin(){
 const current=prompt("Enter current PIN:");
 if(current===null)return;
 const salt=localStorage.getItem(PIN_SALT_KEY)||"";
 const saved=localStorage.getItem(PIN_HASH_KEY)||"";
 const currentHash=await hashPin(current.trim(),salt);
 if(currentHash!==saved){alert("Incorrect current PIN.");return}
 const next=prompt("Enter a new 4–6 digit PIN:");
 if(next===null)return;
 if(!validPin(next.trim())){alert("Use a 4–6 digit numeric PIN.");return}
 const newSalt=randomHex(16);
 const newHash=await hashPin(next.trim(),newSalt);
 localStorage.setItem(PIN_SALT_KEY,newSalt);
 localStorage.setItem(PIN_HASH_KEY,newHash);
 sessionStorage.setItem(PIN_SESSION_KEY,"1");
 toast("PIN changed");
}

}

  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const name=`Renoweet_OS_Backup_${timestampFilePart()}.xlsx`;
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  let p=getP();if(p)addActivity(p,'Backup',`Timestamped database backup created: ${name}`,false);
  toast('Backup downloaded');
 }catch(e){console.error(e);alert('Could not create backup: '+(e?.message||e))}
}

}

function scheduleHTML(){
 const ps=db.projects.filter(p=>p.schedule?.start).sort((a,b)=>String(a.schedule.start).localeCompare(String(b.schedule.start))||String(a.schedule.time||'').localeCompare(String(b.schedule.time||'')));
 const connected=!!googleAccessToken;
 const clientId=getGoogleClientId();
 const todayStr=today();
 const start=weekStart(new Date());
 const days=[...Array(7)].map((_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return localDateISO(d)});
 const week=days.map(ds=>{
   const jobs=ps.filter(p=>scheduleTouchesDate(p,ds));
   return `<div class="plan-day ${ds===todayStr?'today':''}"><div class="plan-day-head"><b>${planDayLabel(ds)}</b><span>${ds.slice(8,10)}</span></div>${jobs.length?jobs.map(p=>planJobCard(p)).join(''):'<div class="small">No jobs</div>'}</div>`;
 }).join('');
 const setup=!clientId?`<div class="google-setup"><h3>Connect Renoweet OS to Google Calendar</h3><p>Enter the Google OAuth Web Client ID once. It stays in this browser only. In Google Cloud, enable Google Calendar API and add this Renoweet OS website address as an Authorized JavaScript origin.</p><div class="formgrid"><div class="field full"><label>Google OAuth Client ID</label><input id="googleClientIdInput" placeholder="...apps.googleusercontent.com" value="${esc(clientId)}"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="saveGoogleClientId()">Save Google Client ID</button></div></div>`:'';
 const rows=ps.map(p=>`<div class="plan-list-row"><div class="plan-date">${fmtDate(p.schedule.start)}<small>${esc(scheduleTimeLabel(p))}</small></div><div><b>${esc(p.title||'Untitled')}</b><div class="small">${esc(p.customer.name||'')} ${p.customer.address?'• '+esc(p.customer.address):''}</div><div class="plan-sync ${p.schedule.calendarEventId?'synced':'local'}">${p.schedule.calendarEventId?'Google Calendar linked':'Renoweet OS only'}</div></div><div class="actions"><button class="btn" onclick="openProject('${p.id}','schedule')">Open</button><button class="btn primary" onclick="syncProjectCalendarById('${p.id}')">${p.schedule.calendarEventId?'Update calendar':'Add to calendar'}</button>${p.schedule.calendarEventId?`<button class="btn danger" onclick="removeProjectCalendarById('${p.id}')">Remove calendar</button>`:''}</div></div>`).join('');
 return `${setup}<div class="plan-toolbar"><div class="plan-status ${connected?'ok':''}">${connected?'● Google Calendar connected':'○ Google Calendar not connected'}</div><button class="btn" onclick="connectGoogleCalendar()">${connected?'Reconnect Google':'Connect Google Calendar'}</button><button class="btn primary" onclick="syncAllScheduledJobs()">Sync all jobs</button><span class="spacer"></span><button class="btn" onclick="shiftPlanWeek(-7)">← Previous</button><button class="btn" onclick="planWeekOffset=0;render()">This week</button><button class="btn" onclick="shiftPlanWeek(7)">Next →</button></div><div class="plan-grid">${week}</div>${ps.length?`<div class="section-title"><h2>Scheduled jobs</h2><span class="small">Renoweet OS → Google Calendar</span></div><div class="plan-list">${rows}</div>`:'<div class="card empty" style="margin-top:14px">No scheduled jobs yet. Open a project and use its Schedule tab.</div>'}`;
}
function backupHTML(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))"><div class="card"><h3>OneDrive XLSX database</h3><p class="small">Use the included <b>Renoweet_OS_Database.xlsx</b>. Put it in your local OneDrive folder, then connect it here in Edge or Chrome.</p><button class="btn primary" onclick="connectWorkbook()">Connect XLSX</button></div><div class="card"><h3>Save behavior</h3><p class="small">Project changes autosave to the local XLSX. OneDrive then syncs the file. Invoices sent from Renoweet OS are stored in a dedicated Bookkeeping sheet inside this OS database. Your formatted bookkeeping master workbook remains separate, so its formatting and charts are not exposed to browser rewriting.</p><button class="btn" onclick="saveWorkbook(true)">Save now</button></div><div class="card"><h3>Timestamped backup</h3><p class="small">Create a full XLSX backup copy before major changes. The connected OneDrive database stays untouched.</p><button class="btn primary" onclick="createTimestampedBackup()">Create backup copy</button></div><div class="card"><h3>PIN security</h3><p class="small">Renoweet OS locks when a new browser session starts. The PIN is stored on this device as a salted cryptographic hash, not as plain text.</p><div class="actions"><button class="btn" onclick="lockRenoweet()">Lock now</button><button class="btn" onclick="changePin()">Change PIN</button></div></div><div class="card"><h3>Mobile use</h3><p class="small">The interface itself is mobile friendly. Direct local XLSX writing is most reliable on desktop Edge/Chrome. On phones, file-system access support depends on the browser/device.</p></div></div>`}

async function makeRenoweetInvoicePdfFile(){
 const invoice=document.querySelector(".ros-invoice-preview");
 if(!invoice)throw new Error("Invoice preview not found.");

 const previous={
   transform:invoice.style.transform,
   margin:invoice.style.margin,
   boxShadow:invoice.style.boxShadow
 };
 invoice.style.transform="none";
 invoice.style.margin="0";
 invoice.style.boxShadow="none";

 try{
   const canvas=await html2canvas(invoice,{
     scale:2,
     backgroundColor:"#ffffff",
     useCORS:true,
     allowTaint:false,
     logging:false
   });

   const {jsPDF}=window.jspdf;
   const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
   const pageW=210,pageH=297;
   const imgH=canvas.height*pageW/canvas.width;
   const img=canvas.toDataURL("image/jpeg",0.96);

   if(imgH<=pageH){
     pdf.addImage(img,"JPEG",0,0,pageW,imgH);
   }else{
     // Keep the invoice readable if it ever becomes taller than one A4 page.
     let remaining=imgH, y=0;
     pdf.addImage(img,"JPEG",0,y,pageW,imgH);
     remaining-=pageH;
     while(remaining>0){
       pdf.addPage();
       y-=pageH;
       pdf.addImage(img,"JPEG",0,y,pageW,imgH);
       remaining-=pageH;
     }
   }

   const p=getP();
   const nr=(p?.invoice?.number||"factuur").trim();
   return new File([pdf.output("blob")],`Factuur-${nr}.pdf`,{type:"application/pdf"});
 }finally{
   invoice.style.transform=previous.transform;
   invoice.style.margin=previous.margin;
   invoice.style.boxShadow=previous.boxShadow;
 }
}

function normalizeWhatsAppNumber(raw){
 let s=String(raw||"").replace(/[^\d+]/g,"");
 if(s.startsWith("00"))s="+"+s.slice(2);
 if(s.startsWith("0"))s="+31"+s.slice(1);
 return s.replace(/[^\d]/g,"");
}

function isMobileDevice(){
 return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints>1 && window.innerWidth<900);
}

function closeSendChoice(){

function smartSendInvoice(){
 const p=getP();
 if(!p)return;

 saveProjectFromForm(false);
 if(!p.invoice.number)p.invoice.number=nextInvoice();
 if(!p.invoice.date)p.invoice.date=today();

 const email=(p.customer.email||"").trim();
 const phone=(p.customer.phone||"").trim();

 if(email && phone){
   const m=document.getElementById("sendChoiceModal");
   const info=document.getElementById("sendChoiceInfo");
   const actions=document.getElementById("sendChoiceActions");
   info.innerHTML=`Client has both:<br><b>${esc(email)}</b><br><b>${esc(phone)}</b>`;

     <button class="btn primary" onclick="closeSendChoice();sendInvoiceByWhatsApp()">WhatsApp PDF</button>`;
   m.classList.add("open");
   return;
 }

 if(email){sendInvoiceByEmail();return}

}

function downloadInvoiceFile(file){
 const url=URL.createObjectURL(file);
 const a=document.createElement("a");
 a.href=url;
 a.download=file.name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function nativeShareInvoice(file,p){
 if(!navigator.share)return false;
 if(navigator.canShare && !navigator.canShare({files:[file]}))return false;
 try{
   await navigator.share({
     title:`Factuur ${p.invoice.number} - Renoweet`,
     text:invoiceShareMessage(p),
     files:[file]
   });
   return true;
 }catch(e){
   if(e && e.name==="AbortError")return true;
   throw e;
 }
}

async function sendInvoiceByEmail(){
 try{
   const p=getP();
   if(!p)return;

   saveProjectFromForm(false);
   if(!p.invoice.number)p.invoice.number=nextInvoice();
   if(!p.invoice.date)p.invoice.date=today();

   const email=(p.customer.email||"").trim();
   if(!email){alert("No client email address is saved.");return}

   const file=await makeRenoweetInvoicePdfFile();

   // Phones: use the native share sheet, which can pass the PDF itself to Gmail.
   if(isMobileDevice()){
     const shared=await nativeShareInvoice(file,p);
     if(shared){
       toast("Choose Gmail to send the PDF");
       return;
     }
   }

   // Laptop/desktop fallback: download PDF and open Gmail compose pre-addressed.
   downloadInvoiceFile(file);

   const subject=`Factuur ${p.invoice.number} - Renoweet`;
   const body=invoiceShareMessage(p);
   const gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
   window.open(gmail,"_blank");

   setTimeout(()=>{
     alert(`The invoice PDF has been downloaded as "${file.name}". Gmail has opened for ${email}. Attach the downloaded PDF to the email and send it.`);
   },350);

 }catch(e){
   if(e && e.name==="AbortError")return;
   console.error(e);
   alert("Could not create/send the invoice PDF: "+(e?.message||e));
 }
}

async function sendInvoiceByWhatsApp(){
 try{
   const p=getP();
   if(!p)return;

   saveProjectFromForm(false);
   if(!p.invoice.number)p.invoice.number=nextInvoice();
   if(!p.invoice.date)p.invoice.date=today();

   const phone=normalizeWhatsAppNumber(p.customer.phone||"");
   if(!phone){alert("No client WhatsApp/phone number is saved.");return}

   const file=await makeRenoweetInvoicePdfFile();

   // Phones: native share sheet can pass the actual PDF to WhatsApp.
   if(isMobileDevice()){
     const shared=await nativeShareInvoice(file,p);
     if(shared){
       toast("Choose WhatsApp and the client chat");
       return;
     }
   }

   // Laptop/desktop fallback: download PDF and open the exact WhatsApp chat.
   downloadInvoiceFile(file);

   const text=encodeURIComponent(invoiceShareMessage(p));
   const wa=`https://web.whatsapp.com/send?phone=${phone}&text=${text}`;
   window.open(wa,"_blank");

   setTimeout(()=>{
     alert(`The invoice PDF has been downloaded as "${file.name}". WhatsApp Web has opened the client chat. Attach the downloaded PDF and send it.`);
   },350);

 }catch(e){
   if(e && e.name==="AbortError")return;
   console.error(e);
   alert("Could not create/send the invoice PDF: "+(e?.message||e));
 }
}

const GOOGLE_CLIENT_ID='1048920224836-lhde9a6dnm157935n9sp13q4o8an891q.apps.googleusercontent.com';
function getGoogleClientId(){return GOOGLE_CLIENT_ID}
function saveGoogleClientId(){let el=$('googleClientIdInput');if(!el)return;let v=el.value.trim();if(!v||!v.endsWith('.apps.googleusercontent.com')){alert('Enter a valid Google OAuth Web Client ID ending in .apps.googleusercontent.com');return}localStorage.setItem('renoweetGoogleClientId',v);googleTokenClient=null;toast('Google Client ID saved');render()}
function ensureGoogleTokenClient(){
 const clientId=getGoogleClientId();
 if(!clientId){alert('First enter your Google OAuth Client ID in Planning.');return false}
 if(!window.google?.accounts?.oauth2){alert('Google sign-in library is still loading. Check your internet connection and try again.');return false}
 if(!googleTokenClient){
   googleTokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:GOOGLE_CAL_SCOPE,callback:()=>{}});
 }
 return true;
}
function googleOAuthEnvironmentCheck(){
 const protocol=location.protocol;
 if(protocol==='file:'){
   throw new Error('Google Calendar cannot connect when Renoweet OS is opened as a downloaded local HTML file. Open the hosted Renoweet OS website (HTTPS/GitHub Pages) and try again.');
 }
 if(protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
   throw new Error('Google Calendar requires a secure HTTPS website. Open Renoweet OS from its HTTPS web address and try again.');
 }
 return true;
}
function requestGoogleToken(forceConsent=false){
 return new Promise((resolve,reject)=>{
   try{googleOAuthEnvironmentCheck()}catch(e){return reject(e)}
   if(googleAccessToken)return resolve(googleAccessToken);
   if(!ensureGoogleTokenClient())return reject(new Error('Google Calendar is not configured.'));
   googleTokenClient.callback=(resp)=>{
     if(resp && resp.error){
       const detail=resp.error_description?`: ${resp.error_description}`:'';
       return reject(new Error(resp.error+detail));
     }
     googleAccessToken=(resp&&resp.access_token)||'';
     if(!googleAccessToken)return reject(new Error('Google did not return an access token.'));
     render();resolve(googleAccessToken)
   };
   // Avoid forcing the consent screen every time. Google will show consent when required.
   googleTokenClient.requestAccessToken({prompt:forceConsent?'consent':''});
 });
}
async function connectGoogleCalendar(){
 try{
   googleAccessToken='';
   await requestGoogleToken(false);
   toast('Google Calendar connected');render();
 }catch(e){
   console.error(e);
   let msg=e.message||String(e);
   if(/origin|invalid_request|OAuth/i.test(msg) && location.protocol!=='file:'){
     msg += `\n\nCurrent website origin: ${location.origin}\nGoogle Cloud → Clients → Renoweet OS web → Authorized JavaScript origins must contain this exact origin.`;
   }
   alert('Google Calendar connection failed: '+msg);
 }
}
function localDateISO(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function weekStart(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+planWeekOffset);let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
function shiftPlanWeek(n){planWeekOffset+=n;render()}
function planDayLabel(ds){let d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',month:'short'})}
function normalizeTimeInput(v){v=String(v||'').trim();let m=v.match(/^(\d{1,2}):(\d{2})/);if(!m)return '';return String(Math.min(23,+m[1])).padStart(2,'0')+':'+m[2]}
function scheduleTimeLabel(p){let s=normalizeTimeInput(p.schedule.time),e=normalizeTimeInput(p.schedule.endTime);return s?(s+(e?' – '+e:'')):'Time not set'}
function scheduleTouchesDate(p,ds){let a=p.schedule.start||'',b=p.schedule.end||a;return !!a&&ds>=a&&ds<=b}
function planJobCard(p){return `<div class="plan-job" onclick="openProject('${p.id}','schedule')"><b>${esc(normalizeTimeInput(p.schedule.time)||'--:--')} • ${esc(p.title||'Untitled')}</b><small>${esc(p.customer.name||'')}${p.customer.address?'<br>'+esc(p.customer.address):''}</small><div class="plan-sync ${p.schedule.calendarEventId?'synced':'local'}">${p.schedule.calendarEventId?'✓ Calendar':'○ OS only'}</div></div>`}
function validateSchedule(p){
 const s=p.schedule||{};if(!s.start)return 'Start date is required.';if(!s.end)s.end=s.start;if(s.end<s.start)return 'End date cannot be before start date.';
 if(!normalizeTimeInput(s.time))return 'Start time is required.';if(!normalizeTimeInput(s.endTime))return 'End time is required.';
 if(s.start===s.end&&s.endTime<=s.time)return 'End time must be after start time.';return '';
}
function calendarDateTime(date,time){return `${date}T${normalizeTimeInput(time)}:00`}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim())}
function inviteStatusLabel(s){return ({accepted:'Accepted',declined:'Declined',tentative:'Tentative',needsAction:'Invited — awaiting response'})[s]||'Invitation sent'}
function calendarEventBody(p){
 const s=p.schedule,endDate=s.end||s.start,invite=(s.shareClient?String(s.inviteEmail||p.customer.email||'').trim():'');
 const body={summary:`Renoweet – ${p.title||p.id}`,location:p.customer.address||'',description:[`Renoweet project: ${p.id}`,p.customer.name?`Customer: ${p.customer.name}`:'',p.customer.phone?`Phone: ${p.customer.phone}`:'',p.description?`Work: ${p.description}`:'',s.notes?`Planning notes: ${s.notes}`:''].filter(Boolean).join('\n'),start:{dateTime:calendarDateTime(s.start,s.time),timeZone:GOOGLE_TIMEZONE},end:{dateTime:calendarDateTime(endDate,s.endTime),timeZone:GOOGLE_TIMEZONE},reminders:{useDefault:true},extendedProperties:{private:{renoweetProjectId:String(p.id)}}};
 if(invite)body.attendees=[{email:invite}];
 return body;
}
function calendarShareSignature(p,body){return JSON.stringify({summary:body.summary,location:body.location,description:body.description,start:body.start,end:body.end,attendees:body.attendees||[]})}
function eventPathWithUpdates(path,sendUpdates){return path+(path.includes('?')?'&':'?')+'sendUpdates='+encodeURIComponent(sendUpdates)}
function updateInviteStateFromEvent(p,ev){
 const email=(p.schedule.inviteEmail||p.schedule.calendarSharedWith||'').trim().toLowerCase();
 const a=(ev?.attendees||[]).find(x=>String(x.email||'').toLowerCase()===email);
 p.schedule.inviteStatus=a?.responseStatus||((p.schedule.shareClient&&email)?'needsAction':'');
}
async function calendarFetch(path,options={}){
 const token=await requestGoogleToken();
 const res=await fetch('https://www.googleapis.com/calendar/v3'+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});
 if(res.status===401){googleAccessToken='';throw new Error('Google authorization expired. Connect Google Calendar again.')}
 if(res.status===204)return null;
 const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body?.error?.message||`Google Calendar error ${res.status}`);return body;
}
async function syncProjectCalendar(p){
 const err=validateSchedule(p);if(err)throw new Error(err);
 const invite=(p.schedule.shareClient?String(p.schedule.inviteEmail||p.customer.email||'').trim():'');
 if(p.schedule.shareClient&&!validEmail(invite))throw new Error('Enter a valid client email before sharing the schedule.');
 p.schedule.inviteEmail=invite;
 const body=calendarEventBody(p),cal=encodeURIComponent(GOOGLE_CALENDAR_ID),sig=calendarShareSignature(p,body),previousShared=String(p.schedule.calendarSharedWith||'').trim();let ev;
 const sharingChanged=previousShared!==invite||String(p.schedule.calendarShareSignature||'')!==sig;
 const sendUpdates=(invite||previousShared)&&sharingChanged?'all':'none';
 if(p.schedule.calendarEventId){
   try{ev=await calendarFetch(eventPathWithUpdates(`/calendars/${cal}/events/${encodeURIComponent(p.schedule.calendarEventId)}`,sendUpdates),{method:'PUT',body:JSON.stringify(body)})}
   catch(e){if(/404|not found/i.test(e.message)){p.schedule.calendarEventId='';ev=await calendarFetch(eventPathWithUpdates(`/calendars/${cal}/events`,invite?'all':'none'),{method:'POST',body:JSON.stringify(body)})}else throw e}
 }else ev=await calendarFetch(eventPathWithUpdates(`/calendars/${cal}/events`,invite?'all':'none'),{method:'POST',body:JSON.stringify(body)});
 p.schedule.calendarEventId=ev.id||p.schedule.calendarEventId;p.schedule.calendarHtmlLink=ev.htmlLink||'';p.schedule.calendarSyncedAt=new Date().toLocaleString('en-GB');p.schedule.calendarSharedWith=invite;p.schedule.calendarShareSignature=sig;updateInviteStateFromEvent(p,ev);p.updated=today();scheduleSave();return ev;
}
async function syncProjectCalendarById(id){let p=db.projects.find(x=>x.id===id);if(!p)return;try{await syncProjectCalendar(p);toast('Google Calendar updated');render();if(currentProjectId===id)renderTabs()}catch(e){console.error(e);alert('Could not sync this job: '+(e.message||e))}}
async function saveAndSyncCurrentSchedule(){let p=getP();saveProjectFromForm(false);if(!p)return;await syncProjectCalendarById(p.id)}
async function syncAllScheduledJobs(){
 const jobs=db.projects.filter(p=>p.schedule?.start);if(!jobs.length){alert('There are no scheduled jobs to sync.');return}
 try{await requestGoogleToken();let ok=0,failed=[];for(const p of jobs){try{await syncProjectCalendar(p);ok++}catch(e){failed.push(`${p.title||p.id}: ${e.message}`)}}scheduleSave();render();if(failed.length)alert(`${ok} job(s) synced.\n\nCould not sync:\n${failed.join('\n')}`);else toast(`${ok} job(s) synced to Google Calendar`)}catch(e){alert('Google Calendar sync failed: '+(e.message||e))}
}
async function removeProjectCalendar(p){

async function removeProjectCalendarById(id){let p=db.projects.find(x=>x.id===id);if(!p||!p.schedule.calendarEventId)return;if(!confirm(`Remove "${p.title||p.id}" from Google Calendar? The Renoweet OS planning entry will stay.`))return;try{await removeProjectCalendar(p);toast('Removed from Google Calendar');render();if(currentProjectId===id)renderTabs()}catch(e){console.error(e);alert('Could not remove calendar event: '+(e.message||e))}}
async function removeCurrentProjectCalendar(){let p=getP();if(p)await removeProjectCalendarById(p.id)}

function scheduleClientMessage(p,asUpdate=false){
 const name=p.customer.name||'klant',title=p.title||'het project',date=p.schedule.start?fmtDate(p.schedule.start):'de afgesproken datum';
 const time=p.schedule.time?' om '+p.schedule.time:'';
 const end=p.schedule.endTime?' tot '+p.schedule.endTime:'';
 const address=p.customer.address?`\nAdres: ${p.customer.address}`:'';
 const notes=p.schedule.notes?`\nOpmerking: ${p.schedule.notes}`:'';
 const calendarLink=p.schedule.calendarHtmlLink?`\n\nGoogle Calendar: ${p.schedule.calendarHtmlLink}`:'';
 return asUpdate
  ? `Beste ${name}, de planning voor "${title}" is gewijzigd naar ${date}${time}${end}.${address}${notes}\n\nDe bijgewerkte afspraak is ook via Google Calendar/e-mail verstuurd.${calendarLink}\n\nGroet, Renoweet`
  : `Beste ${name}, hierbij bevestig ik onze afspraak voor "${title}" op ${date}${time}${end}.${address}${notes}\n\nDe afspraak is ook via Google Calendar/e-mail verstuurd.${calendarLink}\n\nGroet, Renoweet`;
}
function currentScheduleDiffersFromCalendar(p){
 if(!p?.schedule?.calendarEventId||!p.schedule.calendarShareSignature)return false;
 try{return calendarShareSignature(p,calendarEventBody(p))!==p.schedule.calendarShareSignature}catch(e){return false}
}

function sendToBookkeeping(){
 let p=getP();
 saveProjectFromForm(false);
 if(!p.invoice.number)p.invoice.number=nextInvoice();
 if(!p.invoice.date)p.invoice.date=today();

 let t=projectTotals(p);
 let dueDate="";
 try{
   const d=new Date((p.invoice.date||today())+"T12:00:00");
   d.setDate(d.getDate()+(+p.invoice.dueDays||14));
   dueDate=d.toISOString().slice(0,10);
 }catch(e){}

 let description=(p.estimate||[]).map(x=>x.desc).filter(Boolean).join(" | ");
 let row={
   "Invoice number":p.invoice.number,
   "Invoice date":p.invoice.date||today(),
   "Due date":dueDate,
   "Customer":p.customer.name||"",
   "Address":p.customer.address||"",
   "Project":p.title||"",
   "Description":description,
   "Subtotal ex VAT":+t.subtotal.toFixed(2),
   "VAT rate":+(p.quote.vat||21),
   "VAT":+t.vat.toFixed(2),
   "Total incl VAT":+t.total.toFixed(2),
   "Status":"Ready for bookkeeping",
   "Sent at":new Date().toISOString(),
   "Project ID":p.id||""
 };

 if(!db.bookkeeping)db.bookkeeping=[];
 let i=db.bookkeeping.findIndex(x=>(x["Invoice number"]||"")===row["Invoice number"]);
 if(i>=0)db.bookkeeping[i]=row; else db.bookkeeping.push(row);

 p.invoice.status="Sent";
 scheduleSave();
 renderTabs();
 toast("Invoice sent to bookkeeping");
}
